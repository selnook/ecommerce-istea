<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce ISTEA</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <header class="container py-3">
    <nav class="navbar-custom">
      <h1>E-Commerce ISTEA</h1>

      <div class="controls">
        <input
          type="text"
          id="search"
          class="form-control"
          placeholder="Buscar producto"
        >

        <select id="categoryFilter" class="form-select">
          <option value="">Todos</option>
          <option value="men's clothing">Hombre</option>
          <option value="women's clothing">Mujer</option>
          <option value="jewelery">Joyería</option>
          <option value="electronics">Electrónica</option>
        </select>

        <button 
          class="btn btn-dark" 
          data-bs-toggle="modal" 
          data-bs-target="#cartModal"
        >
          Carrito <span id="cartCount">0</span>
        </button>

      </div>
    </nav>
  </header>

  <main class="container">
    <section class="row" id="products"></section>
  </main>


  <footer class="footer-custom">
    <small>E-Commerce ISTEA por Braian Fleitas</small>
  </footer>
  <script type="module" src="./js/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <div class="modal fade" id="cartModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Carrito</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body" id="cartItems"></div>

            <div class="modal-footer">
                <button class="btn btn-success">Comprar</button>
            </div>

        </div>
    </div>
</div>

</body>
</html>
